name: Build & deploy

on:
  push:
    branches: [master]
  schedule:
    # Every 6 hours (UTC) to refresh stats pulled from APIs at build time.
    # Note: GitHub pauses scheduled workflows after ~60 days of no repo activity.
    - cron: '17 */6 * * *'
  workflow_dispatch:

# Least privilege: nothing by default; each job asks for what it needs.
permissions: {}

# Never run two deploys at once; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Third-party action pinned to a commit SHA so a moved tag can't change what runs.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fetches API data. Any source failing (after retries) fails the build,
      # so the previously deployed site stays live.
      - run: pnpm build
        env:
          RENSHUU_API_KEY: ${{ secrets.RENSHUU_API_KEY }}
          CANVAS_FEED_URL: ${{ secrets.CANVAS_FEED_URL }}
          HARDCOVER_API_KEY: ${{ secrets.HARDCOVER_API_KEY }}
          # Automatic per-run token (no secret to create); enough to read public GitHub data.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # Keep this run's fetched data for debugging / history.
      - uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: snapshots/
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
